spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/civicfix?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
server:
  port: 8080
app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-ms: 86400000
